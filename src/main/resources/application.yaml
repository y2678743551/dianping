server:
  port: 8081
spring:
  application:
    name: app
  profiles:
    active: local
  datasource:
    driver-class-name: ${dp.datasource.driver-class-name}
    url: ${dp.datasource.url}
    username: ${dp.datasource.username}
    password: ${dp.datasource.password}
  data:
    redis:
      port:  ${dp.redis.port}
      host:  ${dp.redis.host}
      password: ${dp.redis.password}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  rabbitmq:
    host: ${dp.rabbitmq.host}
    port: ${dp.rabbitmq.port}
    username: ${dp.rabbitmq.username}
    password: ${dp.rabbitmq.password}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        retry:
          enabled: false
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.app.entity # 别名扫描包
logging:
  level:
    com.app: debug